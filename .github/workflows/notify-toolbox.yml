name: Notify my-toolbox

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact template commit
        env:
          TOOLBOX_DISPATCH_TOKEN: ${{ secrets.TOOLBOX_DISPATCH_TOKEN }}
          TEMPLATE_SHA: ${{ github.sha }}
        run: |
          case "$TEMPLATE_SHA" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#TEMPLATE_SHA}" -eq 40
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TOOLBOX_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MatheusFS-dev/my-toolbox/dispatches \
            --data "{\"event_type\":\"agent-workspace-template-updated\",\"client_payload\":{\"sha\":\"$TEMPLATE_SHA\"}}"
