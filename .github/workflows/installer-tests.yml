name: Installer tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run installer tests
        run: python -m unittest discover -s tests -v
      - name: Compile installer scripts
        run: >
          python -m py_compile
          scripts/linux/python3/install_codex.py
          scripts/linux/python3/install_claude.py
          scripts/linux/python3/install_antigravity.py
          scripts/linux/python3/install_project.py
          scripts/windows/install_codex.py
          scripts/windows/install_claude.py
          scripts/windows/install_antigravity.py
          scripts/windows/install_project.py
          scripts/linux/python3/toolbox_adapter.py
          scripts/windows/toolbox_adapter.py
      - name: Run installer doctests
        run: >
          python -m doctest
          scripts/linux/python3/install_codex.py
          scripts/linux/python3/install_claude.py
          scripts/linux/python3/install_antigravity.py
          scripts/linux/python3/install_project.py
          scripts/windows/install_codex.py
          scripts/windows/install_claude.py
          scripts/windows/install_antigravity.py
          scripts/windows/install_project.py

  python2-syntax:
    name: Linux Python 2.7 syntax
    runs-on: ubuntu-latest
    container: python:2.7.18-slim-buster
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Python 2 TOML dependency
        run: pip install -r scripts/linux/python2/requirements.txt
      - name: Run Python 2 toolbox adapter tests
        run: python tests/python2_toolbox_adapter_test.py
      - name: Compile Python 2 installer scripts
        run: >
          python -m py_compile
          scripts/linux/python2/install_codex.py
          scripts/linux/python2/install_claude.py
          scripts/linux/python2/install_antigravity.py
          scripts/linux/python2/install_project.py
          scripts/linux/python2/toolbox_adapter.py
