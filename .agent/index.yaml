version: 3

startup:
  always_read:
    - AGENTS.md
  easy_task_gate:
    rule: apply before normal routing
    read_when_applies:
      - .agent/modes/easy-task.md
    ask_when_uncertain: true
  preferred_router:
    command: python .agent/scripts/route_context.py "<user request>"
    stats_command: python .agent/scripts/route_context.py --stats "<user request>"
    fallback: read this file and apply the same routing manually
  forbidden_broad_reads:
    - tree .agent
    - find .agent
    - grep -R .agent
    - cat .agent/**

routing:
  easy_task:
    priority: before_normal_routes
    conservative: true
    ask_before_escalating: true
    trigger_keywords:
      - easy
      - easy mode
      - trivial
      - simple edit
      - one-line
      - one line
      - typo
      - markdown equation
      - render equation
      - replace phrase
      - change this line
    read:
      - .agent/modes/easy-task.md

  troubleshooting:
    priority: before_coding
    exclusive_unless_code_edit_requested: true
    trigger_keywords:
      - driver
      - cuda
      - tensorflow
      - pytorch
      - torch
      - package conflict
      - dependency error
      - linux
      - windows
      - kernel
      - nvidia
      - gpu
      - venv
      - pip
      - conda
      - import error
    read:
      - .agent/workflows/debugging.md

  coding:
    trigger_keywords:
      - implement
      - code
      - refactor
      - script
      - test
      - debug
      - function
      - class
      - module
      - repository
      - pipeline
      - experiment
      - dataset
      - training
      - inference
      - fix
      - bug
    read:
      - .agent/modes/coding.md
    example_card_search:
      file: .agent/modes/coding-example-cards.md
      rule: search compact cards by risk before reading full examples
      full_examples_file: .agent/modes/coding-full-examples.md

  paper_writing:
    trigger_keywords:
      - manuscript
      - paper
      - reviewer
      - rebuttal
      - abstract
      - introduction
      - related work
      - conclusion
      - latex
    read:
      - .agent/modes/paper-writing.md
      - .agent/skills/scribe/SKILL.md

  plotting:
    trigger_keywords:
      - plot
      - figure
      - visualization
      - matplotlib
      - chart
      - graph
      - histogram
      - scatter
      - boxplot
      - error bar
    read:
      - .agent/rules/plotting-style.md
      - .agent/skills/scientific-plot-maker/SKILL.md

  long_task_state:
    trigger_keywords:
      - session state
      - task state
      - resume state
      - long task state
    explicit_user_request_required: true
    read:
      - .agent/workflows/long-task-state.md

commands:
  project_architecture_refresh:
    command: python .agent/scripts/update_project_map.py
    purpose: scan the repository root and refresh .agent/context/project-map.md
    run_when: the user asks to populate, refresh, repair, regenerate, or audit project architecture context
    after_run_read:
      - .agent/context/project-map.md

conditional_context:
  project_map:
    file: .agent/context/project-map.md
    read_when: repository structure, module ownership, architecture, or file placement matters

  memories:
    file: .agent/context/memories.md
    read_when: durable prior context may affect the task, the user asks to remember or forget something, or durable context must be updated
    after_update_check: python .agent/scripts/memory_lint.py

reference_access:
  mandatory_method: python .agent/scripts/search_reference.py <file> <keywords...>
  rule: search references before reading entire reference files
  full_read_allowed_when:
    - search output is insufficient
    - the reference itself is being edited
    - the user explicitly requests full-reference analysis

never_startup_read:
  - .agent/context/memories.md
  - .agent/skills/**/references/**
  - .agent/skills/**/assets/**
  - .agent/skills/**/scripts/**
  - .agent/scripts/**
  - .agent/prompts/**
  - "*.pdf"
