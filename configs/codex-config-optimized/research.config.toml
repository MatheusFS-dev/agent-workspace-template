# Live technical research profile
# Usage:
#   codex --profile research
#
# Appropriate for current documentation, standards, regulation, literature,
# hardware, products, and evidence-backed technical investigation.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "medium"

# Use current public information. Search-generated sessions remain excluded from
# automatic memory generation by the base memory policy.
web_search = "live"
service_tier = "default"
tool_output_token_limit = 8000

[tools]
# Medium search context gives enough source detail for synthesis while avoiding
# the largest result payloads.
web_search = { context_size = "medium" }

[features]
fast_mode = false
multi_agent = true
memories = true

[agents]
enabled = true

# Two Terra workers can independently inspect source categories while Sol
# performs the final synthesis.
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

[plugins."superpowers@openai-curated"]
enabled = false
