# Deep coding and debugging profile
# Usage:
#   codex --profile deep
#
# Appropriate for complex root-cause analysis, architecture, large interacting
# changes, difficult performance problems, and high-risk correctness work.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "medium"

# Cached search supports documentation lookup without enabling unrestricted live
# research by default.
web_search = "cached"
service_tier = "default"

# Complex diagnostics may require a larger retained error region.
tool_output_token_limit = 8000

[features]
fast_mode = false

# Deep work often needs a unified view of the system. Disable delegation by
# default to avoid several investigations covering the same root cause.
multi_agent = false

# Retain memory use from the base configuration.
memories = true

[agents]
enabled = false

[plugins."superpowers@openai-curated"]
enabled = false

[projects."/home/matheus/src/generic_yolo_detector"]
trust_level = "trusted"
