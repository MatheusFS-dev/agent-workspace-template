# Controlled parallel-agent profile
# Usage:
#   codex --profile parallel
#
# Use only when the task contains independent workstreams that do not require
# shared state and will not edit the same files.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "medium"

web_search = "cached"
service_tier = "default"
tool_output_token_limit = 6000

[features]
fast_mode = false
multi_agent = true

# Disable automatic memory work in the profile intended to create several
# temporary worker threads.
memories = false

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

# Superpowers is enabled only here because its mandatory skill workflow and
# parallel-dispatch methodology are useful specifically for deliberate,
# independently partitioned work.
[plugins."superpowers@openai-curated"]
enabled = true
